name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  # The Trapper SDK's branch/tag to test against (see .github/actions/trapper-sdk).
  TRAPPER_SDK_REF: ${{ vars.TRAPPER_SDK_REF || 'development' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/trapper-sdk
        with:
          ref: ${{ env.TRAPPER_SDK_REF }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest -v

  frontend:
    name: Frontend type check, lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Type check and build
        run: npm run build

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/trapper-sdk
        with:
          ref: ${{ env.TRAPPER_SDK_REF }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build (fails on broken links)
        run: uv run mkdocs build --strict
